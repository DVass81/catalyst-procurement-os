name: Catalyst release quality

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Scan tracked source for committed credentials
        run: npm run secret:scan

      - name: Validate pilot-readiness migrations
        run: npm run migration:validate

      - name: Validate same-image deployment templates
        run: npm run deployment:validate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test connected workflows and guide safeguards
        run: npm run test

      - name: Build production application
        run: npm run build

      - name: Audit all dependencies
        run: npm audit --audit-level=moderate

      - name: Confirm production dependency boundary
        run: npm audit --omit=dev --audit-level=moderate

      - name: Generate CycloneDX software bill of materials
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - name: Upload software bill of materials
        uses: actions/upload-artifact@v4
        with:
          name: catalyst-procurement-os-sbom
          path: sbom.cdx.json
