name: Phase 3 quality

on:
  pull_request:
  push:
    branches:
      - main
      - codex/phase-3-guided-sales-demo

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test connected workflows and guide safeguards
        run: npm run test

      - name: Build production application
        run: npm run build
