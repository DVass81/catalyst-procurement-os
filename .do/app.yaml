name: catalyst-phase3-staging
region: nyc
services:
  - name: web
    github:
      repo: DVass81/catalyst-procurement-os
      branch: codex/mission-back-on-track
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      - key: APP_BASE_URL
        value: ${APP_URL}
        scope: RUN_TIME
      - key: DEMO_AUTH_BYPASS
        value: "1"
        scope: RUN_TIME
      - key: DEMO_AUTH_BYPASS_ACTOR_ID
        type: SECRET
        scope: RUN_TIME
      - key: DEMO_AUTH_BYPASS_EXPIRES_AT
        value: "2026-08-12T23:59:59-04:00"
        scope: RUN_TIME
      - key: CATALYST_SYNTHETIC_ONLY
        value: "1"
        scope: RUN_TIME
      - key: CATALYST_RELEASE_CHANNEL
        value: development-preview
        scope: RUN_TIME
      - key: CATALYST_RELEASE_COMMIT
        value: ${_self.COMMIT_HASH}
        scope: RUN_TIME
      - key: CATALYST_AI_MODE
        value: deterministic
        scope: RUN_TIME
      - key: NEXT_PUBLIC_SUPABASE_URL
        type: SECRET
        scope: RUN_AND_BUILD_TIME
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        type: SECRET
        scope: RUN_AND_BUILD_TIME
      - key: SUPABASE_SECRET_KEY
        type: SECRET
        scope: RUN_TIME
      - key: ACTION_CONFIRMATION_SECRET
        type: SECRET
        scope: RUN_TIME
ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /
