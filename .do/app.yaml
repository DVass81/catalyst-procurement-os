name: catalyst-procurement-os-demo
region: nyc
services:
  - name: web
    github:
      repo: DVass81/catalyst-procurement-os
      branch: codex/phase-3-guided-sales-demo
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      - key: OPENAI_API_KEY
        type: SECRET
        scope: RUN_TIME
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime
        scope: RUN_TIME
      - key: OPENAI_REALTIME_VOICE
        value: marin
        scope: RUN_TIME
      - key: DEMO_ALLOWED_ORIGINS
        value: https://demo.catalystinnovations.example
        scope: RUN_TIME
ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /
