name: catalyst-procurement-os-phase3-staging
region: nyc
services:
  - name: web
    github:
      repo: DVass81/catalyst-procurement-os
      branch: codex/phase3-commercialization-demo
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      - key: OPENAI_API_KEY
        type: SECRET
        scope: RUN_TIME
      - key: APP_BASE_URL
        value: ${APP_URL}
        scope: RUN_TIME
      - key: DEMO_AUTH_BYPASS
        value: "0"
        scope: RUN_TIME
      - key: CATALYST_SYNTHETIC_ONLY
        value: "1"
        scope: RUN_TIME
      - key: CATALYST_RELEASE_CHANNEL
        value: commercialization-staging
        scope: RUN_TIME
      - key: CATALYST_AI_MODE
        value: auto
        scope: RUN_TIME
      - key: NEXT_PUBLIC_SUPABASE_URL
        type: SECRET
        scope: RUN_AND_BUILD_TIME
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        type: SECRET
        scope: RUN_AND_BUILD_TIME
      - key: SUPABASE_SECRET_KEY
        type: SECRET
        scope: RUN_TIME
      - key: ACTION_CONFIRMATION_SECRET
        type: SECRET
        scope: RUN_TIME
      - key: ELEVENLABS_API_KEY
        type: SECRET
        scope: RUN_TIME
      - key: ELEVENLABS_AGENT_ID
        type: SECRET
        scope: RUN_TIME
      - key: ELEVENLABS_VOICE_ID
        type: SECRET
        scope: RUN_TIME
      - key: ELEVENLABS_TOOL_SECRET
        type: SECRET
        scope: RUN_TIME
      - key: ELEVENLABS_WEBHOOK_SECRET
        type: SECRET
        scope: RUN_TIME
      - key: GOOGLE_CLIENT_ID
        type: SECRET
        scope: RUN_TIME
      - key: GOOGLE_CLIENT_SECRET
        type: SECRET
        scope: RUN_TIME
      - key: GOOGLE_OAUTH_STATE_SECRET
        type: SECRET
        scope: RUN_TIME
      - key: TOKEN_ENCRYPTION_KEY
        type: SECRET
        scope: RUN_TIME
ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /
